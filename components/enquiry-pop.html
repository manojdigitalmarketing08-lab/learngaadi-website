<div class="enquiry-modal" id="enquiryModal">
    <div class="modal-box">

        <button class="close-modal">&times;</button>

        <span class="modal-tag">
            FREE ENQUIRY
        </span>

        <h2>Get Free Driving Consultation</h2>

        <p>
            Fill in your details and our instructor will contact you shortly.
        </p>

        <form>

            <div class="form-group">
                <input type="text" placeholder="Full Name">
            </div>

            <div class="form-group">
                <input type="tel" placeholder="Mobile Number">
            </div>

            <div class="form-group">
                <input type="text" placeholder="Your Area">
            </div>

            <div class="form-group">
                <select>
                    <option>Select Course</option>
                    <option>Car Driving</option>
                    <option>Automatic Car</option>
                    <option>Bike Training</option>
                    <option>Own Car Training</option>
                    <option>Ladies Driving</option>
                    <option>Bus Training</option>
                    <option>RTO Services</option>
                </select>
            </div>

            <button class="submit-btn">
                Get Free Callback
            </button>

        </form>

        <div class="popup-note">
            ✓ Trusted by 10,000+ Learners
        </div>

    </div>
</div>
